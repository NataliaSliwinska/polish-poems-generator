<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <link rel="stylesheet" href="src/style.css" />
    <title>AI Poem Generator</title>
  </head>
  <div class="container">
  <body>
    <header>
    <h1> AI Poem Generator</h1>
    </header>
    <main>
    <div class="form-container">
      <form id="poem-form">
        <input
        type="text"
        placeholder="Enter a topic for your poem"
        autoficus
        required
        autocomplete="off"
        class=" prompt-input"
        id="prompt-input"
        />
        <input type="submit" class="submit-button" />
      </form>
      <div class="hint"> i.e: love, nature or autumn...</div>
      </div>
      <div class="poem hidden" id="poem">

      </div>
    </main>
    <footer>
      This project was coded by
      <a href="https://github.com/NataliaSliwinska" target="_blank">
        Natalia Śliwińska</a
      >
      and is open-sourced on
      <a
        href="https://github.com/NataliaSliwinska/polish-poems-generator"
        target="_blank"
        >GitHub</a
      >
      and hosted on
      <a href="https://ai-polish-poems-generator.netlify.app/" target="_blank">
        Netlify</a
      >
    </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
